name: Daily Senate trades

on:
  schedule:
    # 22:30 UTC is 6:30 pm in Washington, after most same-day filings post.
    - cron: '30 22 * * *'
  workflow_dispatch:

env:
  # Print progress as it happens, so the run log shows which filings were read.
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write

concurrency:
  group: senate-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The very first run backfills every filing since 2012 (~1.5 h at the
    # scraper's 2 s per request). After that a run takes a few minutes.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # The DuckDB file is the scraper's memory of which filings it has done.
      # It lives in the Actions cache, not in git, so the repo stays small. If
      # the cache is ever evicted, the next run just backfills again.
      - uses: actions/cache/restore@v4
        with:
          path: congress_trades.duckdb
          key: senate-db-${{ github.run_id }}
          restore-keys: senate-db-

      - run: python scrape_senate.py --selftest

      - run: python daily_senate.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: congress_trades.duckdb
          key: senate-db-${{ github.run_id }}

      - name: Commit the CSV if it changed
        run: |
          git config user.name "senate-data bot"
          git config user.email "senate-data-bot@users.noreply.github.com"
          git add senate_trades.csv
          if git diff --cached --quiet; then
            echo "No new filings."
          else
            git commit -m "Senate trades $(date -u +%Y-%m-%d)"
            git push
          fi
